<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sliceCrust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28743"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="sliceCheese" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background disc -->
  <circle cx="32" cy="32" r="30" fill="#1E1E24" stroke="#D97706" stroke-width="2"/>
  <!-- Pizza Slice -->
  <g filter="url(#shadow)">
    <!-- Cheese body -->
    <path d="M32 14 L50 46 C42 50 22 50 14 46 Z" fill="url(#sliceCheese)"/>
    <!-- Crust -->
    <path d="M14 45 Q32 52 50 45 C48 49 16 49 14 45 Z" fill="url(#sliceCrust)"/>
    <!-- Pepperoni toppings -->
    <circle cx="32" cy="27" r="4.2" fill="#DC2626"/>
    <circle cx="33" cy="28" r="3.2" fill="#B91C1C"/>
    <circle cx="25" cy="37" r="3.8" fill="#DC2626"/>
    <circle cx="26" cy="38" r="2.8" fill="#B91C1C"/>
    <circle cx="39" cy="36" r="3.8" fill="#DC2626"/>
    <circle cx="40" cy="37" r="2.8" fill="#B91C1C"/>
    <!-- Basil leaves / oregano spots -->
    <circle cx="28" cy="30" r="1.3" fill="#16A34A"/>
    <circle cx="36" cy="29" r="1.3" fill="#16A34A"/>
    <circle cx="32" cy="40" r="1.3" fill="#16A34A"/>
  </g>
</svg>
